name: Lookalike Fashion Crawling Pipeline

on:
  schedule:
    # 매일 새벽 3시(KST) 정기 Phase 1 수집 배치 실행 (테스트용 매일 구동)
    # 정식 상용화 시 7일 주기용 설정: 0 18 * * 0 (매주 일요일 KST 새벽 3시)
    - cron: '0 18 * * *'
    # 매일 새벽 5시(KST) 정기 Phase 2 스위칭 배치 실행 (수집 2시간 뒤 — staging 생성 후 24h 대기 중인 전날 데이터 정합성 검사 및 교체)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      brand:
        description: '크롤링할 타겟 브랜드를 선택하세요 (all 선택 시 전체 브랜드 병렬 크롤링)'
        required: true
        default: '8seconds'
        type: choice
        options:
          - all
          - 8seconds
          - musinsa
          - topten
          - uniqlo
          - zara
      action:
        description: '실행할 파이프라인 액션'
        required: true
        default: 'crawl'
        type: choice
        options:
          # Phase 1: 수집 → staging 적재
          - crawl
          # Phase 2: staging → production 스위칭
          - swap
      target_env:
        description: '실행할 대상 환경을 선택하세요 (default: dev 또는 default: prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      limit:
        description: '최대 수집 상품 개수 (crawl 액션 시)'
        required: false
        default: '100'
        type: string
      gender:
        description: '성별 분할 수집 필터 (비워두면 전체, 무신사 등 대용량 분할용)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - Men
          - Women
      category:
        description: '카테고리 분할 수집 필터 (비워두면 전체)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - Outer
          - Top
          - Bottom
      force:
        description: 'swap 액션 시 24시간 대기 조건 무시하고 즉시 강제 스위칭'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Setup Matrix 잡: 수동/정기 스케줄 조건에 맞는 실행 대상 브랜드를 JSON 형태로 추출
  # ─────────────────────────────────────────────────────────────────────────────
  setup-matrix:
    name: "크롤링 매트릭스 구성"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # 스케줄 실행이거나 수동 실행에서 brand가 'all'인 경우 -> 병렬 전체 브랜드 구성
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.brand }}" = "all" ]; then
            LIMIT="${{ github.event.inputs.limit }}"
            if [ -z "$LIMIT" ]; then
              LIMIT="200"
            fi
            # 전체 브랜드에 대해 개별 Matrix 분기 생성 (무신사는 Men, Women 분할)
            echo 'matrix={"include":[{"brand":"8seconds","limit":"'$LIMIT'","gender":"","category":""},{"brand":"topten","limit":"'$LIMIT'","gender":"","category":""},{"brand":"uniqlo","limit":"'$LIMIT'","gender":"","category":""},{"brand":"zara","limit":"'$LIMIT'","gender":"","category":""},{"brand":"musinsa","limit":"150","gender":"Men","category":""},{"brand":"musinsa","limit":"150","gender":"Women","category":""}]}' >> $GITHUB_OUTPUT
          else
            # 단일 브랜드 수동 실행
            LIMIT="${{ github.event.inputs.limit }}"
            GENDER="${{ github.event.inputs.gender }}"
            CATEGORY="${{ github.event.inputs.category }}"
            echo "matrix={\"include\":[{\"brand\":\"${{ github.event.inputs.brand }}\",\"limit\":\"$LIMIT\",\"gender\":\"$GENDER\",\"category\":\"$CATEGORY\"}]}" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 1 크롤링 실행: 각 브랜드별로 독립된 병렬 러너(Matrix)에서 동시에 구동
  # ─────────────────────────────────────────────────────────────────────────────
  crawl_phase1:
    name: "Phase 1 — ${{ matrix.brand }} (${{ matrix.gender || '전체' }}/${{ matrix.category || '전체' }}) 수집"
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
      fail-fast: false  # 특정 브랜드 수집이 실패해도 다른 브랜드에 영향이 가지 않음
    # 수동 crawl 모드이거나, 18:00 UTC 스케줄 구동 시 실행
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'crawl') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * *')

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright psycopg2-binary aiohttp cloudinary python-dotenv requests numpy

      - name: Playwright 브라우저 설치
        run: |
          python -m playwright install --with-deps chromium

      - name: 크롤링 실행
        env:
          ENV_MODE: ${{ github.event.inputs.target_env || 'dev' }}
          DATABASE_URL: ${{ (github.event.inputs.target_env || 'dev') == 'prod' && secrets.PROD_DATABASE_URL || secrets.DEV_DATABASE_URL }}
          DW_DATABASE_URL: ${{ (github.event.inputs.target_env || 'dev') == 'prod' && secrets.PROD_DW_DATABASE_URL || secrets.DEV_DW_DATABASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ (github.event.inputs.target_env || 'dev') == 'prod' && secrets.PROD_CLOUDINARY_CLOUD_NAME || secrets.DEV_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ (github.event.inputs.target_env || 'dev') == 'prod' && secrets.PROD_CLOUDINARY_API_KEY || secrets.DEV_CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ (github.event.inputs.target_env || 'dev') == 'prod' && secrets.PROD_CLOUDINARY_API_SECRET || secrets.DEV_CLOUDINARY_API_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ matrix.gender }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --gender ${{ matrix.gender }}"
          fi
          if [ -n "${{ matrix.category }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --category ${{ matrix.category }}"
          fi

          echo ">>> 🚀 Starting Phase 1 crawl for ${{ matrix.brand }} (limit=${{ matrix.limit }}) $EXTRA_ARGS on environment: ${ENV_MODE}"
          python data-pipeline/crawlers/web_crawlers/crawling_pipeline_cli.py \
            --brand "${{ matrix.brand }}" \
            --limit "${{ matrix.limit }}" \
            --action crawl \
            $EXTRA_ARGS

  # ─────────────────────────────────────────────────────────────────────────────
  # Setup Swap Matrix 잡: 스위칭을 병렬로 진행하기 위해 대상 브랜드 구성
  # ─────────────────────────────────────────────────────────────────────────────
  setup-swap-matrix:
    name: "스위칭 매트릭스 구성"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.brand }}" = "all" ]; then
            echo 'matrix={"include":[{"brand":"8seconds"},{"brand":"musinsa"},{"brand":"topten"},{"brand":"uniqlo"},{"brand":"zara"}]}' >> $GITHUB_OUTPUT
          else
            echo "matrix={\"include\":[{\"brand\":\"${{ github.event.inputs.brand }}\"}]}" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 2 스위칭 실행: 각 브랜드별로 독립된 병렬 러너(Matrix)에서 스위칭(swap) 진행
  # ─────────────────────────────────────────────────────────────────────────────
  swap_phase2:
    name: "Phase 2 — ${{ matrix.brand }} 스위칭"
    needs: setup-swap-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup-swap-matrix.outputs.matrix) }}
      fail-fast: false
    # 수동 swap 모드이거나, 20:00 UTC 스케줄 구동 시 실행
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'swap') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * *')

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary aiohttp cloudinary python-dotenv requests numpy

      - name: 스위칭 실행
        env:
          ENV_MODE: ${{ github.event.inputs.target_env || 'dev' }}
          DATABASE_URL: ${{ (github.event.inputs.target_env || 'dev') == 'prod' && secrets.PROD_DATABASE_URL || secrets.DEV_DATABASE_URL }}
          DW_DATABASE_URL: ${{ (github.event.inputs.target_env || 'dev') == 'prod' && secrets.PROD_DW_DATABASE_URL || secrets.DEV_DW_DATABASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ (github.event.inputs.target_env || 'dev') == 'prod' && secrets.PROD_CLOUDINARY_CLOUD_NAME || secrets.DEV_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ (github.event.inputs.target_env || 'dev') == 'prod' && secrets.PROD_CLOUDINARY_API_KEY || secrets.DEV_CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ (github.event.inputs.target_env || 'dev') == 'prod' && secrets.PROD_CLOUDINARY_API_SECRET || secrets.DEV_CLOUDINARY_API_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
            echo "⚡ Force 스위칭 모드 활성화"
          fi

          echo ">>> 🔄 Starting Phase 2 swap for ${{ matrix.brand }} $FORCE_FLAG on environment: ${ENV_MODE}"
          python data-pipeline/crawlers/web_crawlers/crawling_pipeline_cli.py \
            --brand "${{ matrix.brand }}" \
            --action swap \
            $FORCE_FLAG
