{% extends "base.html" %}

{% block title %}Lookalike - 검색 결과{% endblock %}

{% block content %}
<div class='d-flex align-items-center mb-4' id='search-results-app' data-query='{{ query }}'>
    <i class="fas fa-search me-2 text-primary"></i>
    <h5 class="fw-bold m-0" id="searchTitle">검색 결과</h5>
</div>

<p class="text-muted small mb-3">유사도 기준으로 정렬한 검색 결과입니다.</p>

<!-- Loading Overlay -->
<div id="resultsLoading" class="text-center py-5">
    <div class="spinner-border text-primary mb-3" role="status">
        <span class="visually-hidden">검색 중...</span>
    </div>
    <p class="text-muted mb-0">검색어 "<span id="displayQuery" class="fw-bold">{{ query }}</span>" 에 일치하는 상품을 찾는 중입니다...
    </p>
</div>

<!-- Category Error or Empty View -->
<div id="resultsEmpty" class="d-none text-center py-5">
    <i class="fas fa-search text-muted mb-3" style="font-size: 3rem;"></i>
    <p class="text-muted" id="emptyMessage">조건에 맞는 검색 결과를 찾지 못했습니다.</p>
</div>

<!-- Dynamic Search Results -->
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="resultsContainer">
    <!-- Results will be dynamically populated here -->
</div>

<script src='/static/js/search_results.js?v={{ range(1, 999999) | random }}'></script>
{% endblock %}
